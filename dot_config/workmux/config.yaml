# Config globale workmux — surchargeable par .workmux.yaml dans chaque projet
main_branch: main
agent: claude -c || claude
merge_strategy: rebase

post_create:
  - mise trust
  - workmux setup
  - workmux sidebar

panes:
  - command: <agent>
    focus: true
  - command: nvim .
    split: horizontal
nerdfont: true
